name: Build & Publish Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Matddns.slnx --logger GitHubActions

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version & build metadata
        id: ver
        run: |
          # Bump MAJOR_MINOR when the config schema changes (see ConfigService.CurrentSchemaVersion).
          MAJOR_MINOR=0.4
          echo "version=${MAJOR_MINOR}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        run: echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            BUILD=${{ github.run_number }}
            BUILD_DATE=${{ steps.ver.outputs.date }}

  # Second, separate ARM64 image. Runs AFTER the amd64 job (needs: build-and-push) so the normal
  # (amd64) build and tags are produced first and stay exactly as before. This job publishes distinct
  # "-arm64" tags (e.g. :latest-arm64, :<version>-arm64) via QEMU emulation, so it never touches the
  # amd64 :latest. Pull the -arm64 image on ARM64 hosts (Raspberry Pi etc.).
  build-arm64:
    name: Build image (arm64)
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version & build metadata
        id: ver
        run: |
          # Bump MAJOR_MINOR when the config schema changes (see ConfigService.CurrentSchemaVersion).
          MAJOR_MINOR=0.4
          echo "version=${MAJOR_MINOR}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        run: echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (arm64)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Every tag carries an explicit -arm64 suffix so it can never overwrite the amd64 tags (especially :latest).
          tags: |
            type=raw,value=latest-arm64,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }}-arm64
            type=sha,format=short,suffix=-arm64
            type=ref,event=tag,suffix=-arm64
            type=semver,pattern={{version}},suffix=-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            BUILD=${{ github.run_number }}
            BUILD_DATE=${{ steps.ver.outputs.date }}
